# Test override, used only by infra/sprint/test/check-sprint-image.sh:
#   docker compose -f ../docker-compose.yml -f docker-compose.test.yml ...
# It is the only mechanism that puts the stub ahead of the real claude on PATH
# (/usr/local/sbin precedes /usr/local/bin in the node image); the
# production entrypoint and compose file have no test switch.
#
# Every HARNESS_* value is a non-secret path or name chosen by the harness.
services:
  sprint:
    # Not sprint-<id>, so a test never collides with a real sprint container.
    container_name: ${HARNESS_CONTAINER}
    volumes:
      - ${HARNESS_STUB}:/usr/local/sbin/claude:ro
      - ${HARNESS_REMOTE}:/remote/repo.git:ro
    environment:
      # The bind-mounted bare repo is owned by another uid; trust it for this
      # test only (the production image trusts nothing extra).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /remote/repo.git

volumes:
  work:
    name: ${HARNESS_WORK_VOLUME}
