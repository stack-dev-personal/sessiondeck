# Unprivileged static server for the sessiondeck web build. Listens on 8080 (no root, no port < 1024).
# Installed as an envsubst template: the image renders it at container start into /etc/nginx/conf.d
# (compose mounts that directory as tmpfs so the root filesystem stays read-only). Only SD_* variables
# are substituted; nginx's own $variables are left alone.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # connect-src: 'self' plus the hub origin(s) from SD_WEB_CONNECT_SRC (validated by the entrypoint hook
  # 05-validate-sd-env.sh before rendering). The UI keeps the hub token in browser storage, so a script
  # must not be able to send it to an arbitrary origin.
  set $sd_csp "default-src 'self'; connect-src 'self' ${SD_WEB_CONNECT_SRC}; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  # A location with its own add_header drops the server-level ones, so each location repeats the full set.
  # Hashed build assets: immutable, and a missing file is a real 404 (never index.html).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";  # no "always": a 404 must not be cached for a year
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $sd_csp always;
  }

  # SPA fallback: any non-file path serves index.html so deep links (/board) work.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $sd_csp always;
  }
}
