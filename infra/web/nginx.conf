# Unprivileged static server for the sessiondeck web build. Listens on 8080 (no root, no port < 1024).
# Installed as an envsubst template: the image renders it at container start into /etc/nginx/conf.d
# (compose mounts that directory as tmpfs so the root filesystem stays read-only). Only SD_* variables
# are substituted; nginx's own $variables are left alone.

# Hashed build assets are immutable and never fall back to index.html; everything else is never cached.
map $uri $sd_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
}
map $uri $sd_fallback {
  default /index.html;
  ~^/assets/ =404;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Exactly one location, so every header is set in exactly one place (a location with its own
  # add_header drops the server-level ones). SPA fallback: any non-file path serves index.html so deep
  # links (/board) work.
  location / {
    try_files $uri $sd_fallback;
    add_header Cache-Control $sd_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # connect-src: 'self' plus the hub origin(s) from SD_WEB_CONNECT_SRC. The UI keeps the hub token in
    # browser storage, so a script must not be able to send it to an arbitrary origin.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${SD_WEB_CONNECT_SRC}; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
