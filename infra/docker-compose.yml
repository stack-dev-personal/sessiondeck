# sessiondeck laptop stack: hub + static web. Phase 2 scope.
#   cp infra/.env.example infra/.env && chmod 600 infra/.env   (then set HUB_TOKEN)
#   docker compose -f infra/docker-compose.yml up -d --build
# Never run `docker compose config` against the real env file in a shared session: it prints it.
# Default-deny: both ports publish on loopback only. A LAN bind is an explicit override
# (SD_HUB_PUBLISH_IP / SD_WEB_PUBLISH_IP). Those names are compose-only: the hub never reads them, so a
# leftover `export HUB_BIND=...` or HUB_PORT in the shell cannot change what is published.
# Shell values win over infra/.env for compose interpolation; check `env | grep -E 'SD_|HUB_'`.
name: sessiondeck

services:
  hub:
    build:
      context: ..
      dockerfile: packages/hub/Dockerfile
    image: sessiondeck-hub:dev
    env_file:
      # HUB_TOKEN (required, >= 16 chars) and optional HUB_* tuning. Gitignored, never baked into the image.
      - ${HUB_ENV_FILE:-.env}
    environment:
      # Inside the container the hub must listen on all interfaces so the published port reaches it.
      # Exposure to the host network is decided only by the port mapping below.
      HUB_BIND: 0.0.0.0
      HUB_PORT: "8787"
      # Default-deny for WebSocket upgrades: the local web origin only (an empty list accepts any Origin).
      HUB_ALLOWED_ORIGINS: ${HUB_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      HUB_DB_PATH: /data/hub.sqlite
    ports:
      - "${SD_HUB_PUBLISH_IP:-127.0.0.1}:${SD_HUB_PUBLISH_PORT:-8787}:8787"
    volumes:
      - hub-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # The image declares the same HEALTHCHECK; stated here so the compose file is self-describing.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    image: sessiondeck-web:dev
    environment:
      # Hub origin(s) the page may connect to (CSP connect-src), space separated, http and ws forms.
      SD_WEB_CONNECT_SRC: ${SD_WEB_CONNECT_SRC:-http://localhost:8787 ws://localhost:8787 http://127.0.0.1:8787 ws://127.0.0.1:8787}
    ports:
      - "${SD_WEB_PUBLISH_IP:-127.0.0.1}:${SD_WEB_PUBLISH_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      # The image renders the nginx template into conf.d at start; keep it writable while / is read-only.
      - /etc/nginx/conf.d:size=1m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  hub-data:
