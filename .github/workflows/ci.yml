name: ci

on:
  push:
    branches: [main, "sprint/**", "p*/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    # Job budget (minutes): setup, checkout, pnpm install and cache 5 + typecheck, lint, lint:root,
    # format:check and the fixture gate 5 + test 1 + guard timing 7 + sprint tooling 3 = 21;
    # 30 leaves a margin of 9 for a cold cache on a slow Windows runner. The job limit must stay
    # above the sum of the step limits, or a slow step is cancelled by the job and not by itself.
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm lint:root
      - run: pnpm format:check
      - name: fixture leak gate (R0.7, patterns and structure, no raw/ needed)
        run: pnpm -F @sessiondeck/scripts fixture:leak
      - name: test (R0.5 budget 60 s)
        run: pnpm -r test
        timeout-minutes: 1
      - name: test guard timing (outside R0.5 budget, up to 3 attempts)
        # Timing rows moved out of the R0.5 step (decision 13). The runner reruns the whole run only
        # when every failed test failed on a timing bound; any other failure fails the step at once.
        # Budget: patched run is 27.8 s per attempt locally (docs/patches/README.md); 4x for a Windows
        # runner is about 111 s; 3 attempts are about 333 s; 7 min (420 s) covers that plus the three
        # vitest start-ups. The unpatched run (18 s per attempt) would fit in 5 min; the patch does not.
        run: pnpm -F @sessiondeck/scripts test:guard-timing:ci
        timeout-minutes: 7
      - name: test sprint tooling (budget 3 min, separate from R0.5)
        # shell: pwsh makes the step fail to start where pwsh is missing; otherwise every test
        # skips and the step goes green with nothing tested.
        shell: pwsh
        run: pnpm -F @sessiondeck/scripts test:sprint
        timeout-minutes: 3

  e2e-web:
    name: e2e-web (Playwright smoke, mock build)
    # Visual baselines in packages/web/e2e/__screenshots__ were generated in this exact image;
    # any other image renders fonts differently and the screenshot comparisons fail.
    # Budget (minutes): install 3 + mock build 1 + suite 5 = 9; 15 leaves a margin.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: playwright smoke (R3.2, R3.4, R3.5, R3.7, R3.8)
        working-directory: packages/web
        # github.workspace expands to the host path in container jobs; the shell variable is the in-container path.
        run: SCREENS_DIR="$GITHUB_WORKSPACE/e2e-screens" node node_modules/@playwright/test/cli.js test
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-screens
          path: e2e-screens
          if-no-files-found: warn
      - name: upload playwright results (actual, expected, diff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-results
          path: /tmp/sd-pw-results
          if-no-files-found: warn

  e2e-web-live:
    name: e2e-web-live (Playwright, live hub)
    # Not inside a container: packages/web/scripts/e2e-live.sh drives docker itself (builds the hub
    # image, starts hub, ws-gate and the pinned Playwright image on a private network, removes them).
    # Budget (minutes): install 3 + hub image build 4 + suite 5 = 12; 20 leaves a margin.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SD_E2E_SCREENS_OUT: ${{ github.workspace }}/e2e-live-screens
      SD_E2E_RESULTS_OUT: ${{ github.workspace }}/e2e-live-results
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: live playwright specs (R3.1, R3.3, R3.9)
        # The script generates its own random hub token; nothing secret is passed in.
        # R3.6 is skipped here: its dropped-frame rule is too tight for shared runners. It is gated in
        # the verifier's container run (VERIFY-P3.md) and reported by the next step.
        env:
          SD_E2E_SKIP_PERF: "1"
        run: bash packages/web/scripts/e2e-live.sh
      - name: R3.6 perf trace (report-only)
        continue-on-error: true
        env:
          SD_E2E_SKIP_PERF: "0"
          SD_E2E_ARGS: R3.6
          SD_E2E_PREFIX: sd-1-S6-perf
          SD_E2E_SCREENS_OUT: ${{ github.workspace }}/e2e-live-perf-screens
          SD_E2E_RESULTS_OUT: ${{ github.workspace }}/e2e-live-perf-results
        run: bash packages/web/scripts/e2e-live.sh
      - name: upload R3.6 perf trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-live-perf
          path: e2e-live-perf-screens
          if-no-files-found: warn
      - name: upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-live-screens
          path: e2e-live-screens
          if-no-files-found: warn
      - name: upload live playwright results (actual, expected, diff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-live-results
          path: e2e-live-results
          if-no-files-found: warn
